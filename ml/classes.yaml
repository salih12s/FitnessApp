# Turkish food classes for the on-device recognition model (see docs/food-model.md).
#
# Classes follow how a dish LOOKS in a photo, not its recipe, because that is
# what a vision model can tell apart. Dishes that are nearly identical on a
# plate share a `look_alike` group; the app shows the top guesses and the user
# picks the right variant, so a mix-up between two variants costs little.
#
#   tier: pilot     the first ~40 classes, used to prove the whole pipeline
#         core      the rest of the built-in set (pilot + core is about 150)
#         extended  the long tail; candidates for the paid "custom catalog" tier
#   meals: breakfast | lunch | dinner | snack | dessert | drink
#   commons: Wikimedia Commons categories with freely licensed photos (a seed
#            only: most dishes have fewer than 50 files there). A category can be
#            about something else with the same name, so every photo is reviewed
#            by a person before training (scripts/contact_sheet.py, review.py).
version: 1
