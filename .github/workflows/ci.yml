name: CI

on:
  push:
    branches: [master]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      # Prisma only needs a well-formed URL to generate the client and validate
      # the schema; nothing connects to a database in this workflow.
      DATABASE_URL: mysql://ci:ci@127.0.0.1:3306/ci
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      # `postinstall` also runs prisma generate, which typecheck/build need.
      - run: npm ci
      - run: npm run prisma:validate
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run test
      - run: npm run build
