<!doctype html>
<html lang="tr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Setlerini kaydet, rekorlarını ve gelişimini takip et."
    />
    <meta name="theme-color" content="#f3f4f6" />
    <title>FitnessApp</title>
    <script>
      // Resolve the theme before first paint to avoid a flash. Keep in sync
      // with src/lib/theme.ts.
      (function () {
        var preference = 'system';
        try {
          preference = localStorage.getItem('fitness-theme') || 'system';
        } catch (error) {}
        var isDark =
          preference === 'dark' ||
          (preference !== 'light' &&
            window.matchMedia('(prefers-color-scheme: dark)').matches);
        document.documentElement.dataset.theme = isDark ? 'dark' : 'light';
        document
          .querySelector('meta[name="theme-color"]')
          .setAttribute('content', isDark ? '#0e0f11' : '#f3f4f6');
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
